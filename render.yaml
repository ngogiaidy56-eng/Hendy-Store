services:
  - type: web
    name: hendy-store
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: checksPass
    healthCheckPath: /api.php?action=health
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: production
      - key: STORE_NAME
        value: Hendy Store
      - key: APP_URL
        value: auto
      - key: APP_AUTO_DETECT_DOMAINS
        value: "true"
      - key: APP_ALLOWED_HOSTS
        value: hendy-store.onrender.com,hendystore-next.onrender.com,hendystore-pages.pages.dev
      - key: APP_ALLOWED_ORIGINS
        value: https://hendy-store.onrender.com,https://hendystore-next.onrender.com,https://hendystore-pages.pages.dev
      - key: APP_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_FALLBACK_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: NEON_AUTH_BASE_URL
        value: https://ep-withered-sunset-bekyloue.neonauth.c-9.us-east-2.aws.neon.tech/neondb/auth
      - key: NEON_AUTH_JWKS_URL
        value: https://ep-withered-sunset-bekyloue.neonauth.c-9.us-east-2.aws.neon.tech/neondb/auth/.well-known/jwks.json
      - key: NEON_AUTH_PUBLIC_SIGNUP
        value: "false"
      - key: GOOGLE_OAUTH_ENABLED
        value: "false"
      - key: NEON_DATA_API_URL
        value: https://ep-withered-sunset-bekyloue.apirest.c-9.us-east-2.aws.neon.tech/Hendy_Store/rest/v1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        value: https://br-frosty-wildflower-bevhhzlb.storage.c-9.us-east-2.aws.neon.tech
      - key: AWS_REGION
        value: us-east-2
      - key: NEON_STORAGE_FORCE_PATH_STYLE
        value: "true"
      - key: NEON_STORAGE_BUCKET
        value: hendy-store-files
      - key: OBJECT_STORAGE_PROVIDER
        value: neon
      - key: OBJECT_STORAGE_LEGACY_NEON_READ_FALLBACK
        value: "false"
      - key: NEON_AI_GATEWAY_BASE_URL
        value: https://br-frosty-wildflower-bevhhzlb-api.ai.c-9.us-east-2.aws.neon.tech
      - key: NEON_AI_GATEWAY_TOKEN
        sync: false
      - key: NEON_AI_MODEL
        value: gpt-5-mini
      - key: NEON_REALTIME_URL
        value: https://ep-withered-sunset-bekyloue.rt.c-9.us-east-2.aws.neon.tech/
      - key: NEON_REALTIME_SECRET
        sync: false
      - key: NEON_STORE_FUNCTION_URL
        value: https://br-frosty-wildflower-bevhhzlb-storeapi.compute.c-9.us-east-2.aws.neon.tech/
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: FORCE_SECURE_COOKIES
        value: "true"
      - key: FORCE_HTTPS
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: MAX_UPLOAD_BYTES
        value: "209715200"
      - key: MAX_DIRECT_UPLOAD_BYTES
        value: "681574400"
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: CODE_SIGNING_SERVICE_URL
        sync: false
      - key: CODE_SIGNING_SERVICE_TOKEN
        sync: false
