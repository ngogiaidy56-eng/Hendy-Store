services:
  - type: web
    name: hendystore-next
    runtime: docker
    rootDir: apps/storefront-next
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: HENDY_API_ORIGIN
        value: https://hendy-store.onrender.com
      - key: NEON_AUTH_BASE_URL
        value: https://ep-withered-sunset-bekyloue.neonauth.c-9.us-east-2.aws.neon.tech/neondb/auth
      - key: NEON_AUTH_COOKIE_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        value: https://hendystore-next.onrender.com
      - key: DEPLOY_TARGET
        value: render
